server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Cache de assets estáticos com hash no nome (build do Vite)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy das chamadas de API para o backend
    location /api/ {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Proxy de uploads (imagens de produtos)
    location /uploads/ {
        proxy_pass http://backend:3333;
        proxy_set_header Host $host;
    }

    # Health check do backend
    location /health {
        proxy_pass http://backend:3333;
        proxy_set_header Host $host;
    }

    # SPA — todas as rotas servem o index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança: oculta versão do nginx
    server_tokens off;

    # Headers de segurança
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
