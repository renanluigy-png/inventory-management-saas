name: Restore React Frontend After Legacy Pages Deploy

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-react-final
  cancel-in-progress: false

jobs:
  restore-frontend:
    # The branch-based GitHub Pages workflow can still run in parallel with
    # our React deployment. Wait for that workflow to finish, then deploy the
    # actual Vite/React frontend as the final Pages deployment.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build de produção
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /inventory-management-saas/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato React
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publicar frontend React
        uses: actions/deploy-pages@v4
