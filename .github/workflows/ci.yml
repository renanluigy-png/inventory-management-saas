name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        node: ['22']

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar TypeScript
        run: npm run lint

      - name: Rodar testes
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: test-secret-for-ci-minimum-32-characters-long
          JWT_EXPIRES_IN: 28800
          PORT: 3334
          CORS_ORIGIN: http://localhost:5173

      - name: Build de produção
        run: npm run build

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node: ['22']

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run lint

      - name: Rodar testes
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3333

  # ── Docker Build Validation ───────────────────────────────────────────────────
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: controle-estoque-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagem frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: controle-estoque-frontend:ci
          build-args: VITE_API_URL=http://localhost:3333
          cache-from: type=gha
          cache-to: type=gha,mode=max
